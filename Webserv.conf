server
{
    listen 8080;
    listen 8080;
    listen 8080;

    host 127.0.0.1;
    server_name localhost;

    
    # index index.html;
    client_max_body_size 10M;

    error_page 404 ./error_page/404.html;
    error_page 400 ./error_page/400.html;
    error_page 403 ./error_page/403.html;
    error_page 405 ./error_page/405.html;
    error_page 408 ./error_page/408.html;
    error_page 411 ./error_page/411.html;
    error_page 413 ./error_page/413.html;
    error_page 500 ./error_page/500.html;
    error_page 505 ./error_page/505.html;
    location / {
        root            ./www/html;
        allowed_methods GET POST DELETE; 
        autoindex off;
        return 301 /new;

    }
    location /uploads {
        root            ./www;
        allowed_methods GET POST DELETE;
        upload_path ./www/uploads;
        autoindex on;
        return 301 /new;


    }

    location .py {
        root            ./www/html/cgi-bin;
        allowed_methods GET POST DELETE;

        cgi_pass /usr/bin/python3;
    }


    location .php {
        root            ./www/html/cgi-bin;
        allowed_methods GET POST DELETE;
        cgi_pass /usr/bin/php;
    }
    
    error_page 504 ./error_page/504.html;
}

